name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: testing
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install client dependencies
      run: yarn
    - name: Install server dependencies
      run: npm install
      working-directory: ./server
    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps
    - name: Run Playwright tests
      env:
        # client
        API_ORIGIN: http://localhost:4000
        NEXT_PUBLIC_SERVER_URL: /api
        NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
        # server
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        ALLOWED_ORIGINS: http://localhost:3000
        NODE_ENV: development
        PORT: 4000
        # playwright
        CI: true
        PW_SETUP_USER_EMAIL: ${{ secrets.PW_SETUP_USER_EMAIL }}
        PW_SETUP_USER_PASSWORD: ${{ secrets.PW_SETUP_USER_PASSWORD }}
        PW_SETUP_ADMIN_EMAIL: ${{ secrets.PW_SETUP_ADMIN_EMAIL }}
        PW_SETUP_ADMIN_PASSWORD: ${{ secrets.PW_SETUP_ADMIN_PASSWORD }}
      run: yarn playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: client/playwright-report/
        retention-days: 30
